<svg width="900" height="90" viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="90" fill="url(#glow)"/>

  <!-- ponto pulsando -->
  <circle cx="318" cy="30" r="4" fill="#8b949e">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="318" cy="30" r="4" fill="none" stroke="#8b949e" stroke-width="1">
    <animate attributeName="r" values="4;11" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="334" y="36" font-family="'Courier New', monospace" font-size="18" fill="#8b949e">currently learning</text>

  <text x="450" y="66" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#ffffff">React Native</text>

  <!-- barra de progresso em loop -->
  <rect x="330" y="78" width="240" height="2" rx="1" fill="#8b949e" opacity="0.2"/>
  <rect x="330" y="78" width="0" height="2" rx="1" fill="#8b949e">
    <animate attributeName="width" values="0;240;240;0" keyTimes="0;0.6;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
