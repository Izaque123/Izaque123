<svg width="900" height="24" viewBox="0 0 900 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b949e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="25%" stop-color="#fff"/>
      <stop offset="75%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="24">
      <rect width="900" height="24" fill="url(#edge)"/>
    </mask>
  </defs>

  <!-- linha base -->
  <rect x="100" y="11" width="700" height="1.5" fill="url(#base)"/>

  <!-- brilho que atravessa -->
  <g mask="url(#fade)">
    <rect x="-160" y="10.5" width="160" height="2.5" fill="url(#shine)">
      <animate attributeName="x" values="-160;900;900" keyTimes="0;0.7;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- losango central -->
  <rect x="446" y="8" width="8" height="8" fill="#0d1117" stroke="#8b949e" stroke-width="1" transform="rotate(45 450 12)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
