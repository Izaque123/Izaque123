<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b949e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="120" rx="12" fill="#0d1117"/>
  <rect width="900" height="120" rx="12" fill="url(#glow)"/>

  <!-- linha superior -->
  <rect x="150" y="10" width="600" height="1.5" fill="url(#line)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- partículas -->
  <g fill="#8b949e">
    <circle cx="60" cy="130" r="2">
      <animate attributeName="cy" values="130;-10" dur="7s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="130" r="3">
      <animate attributeName="cy" values="130;-10" dur="9s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="130" r="1.5">
      <animate attributeName="cy" values="130;-10" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="130" r="2.5">
      <animate attributeName="cy" values="130;-10" dur="8s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="130" r="2">
      <animate attributeName="cy" values="130;-10" dur="7.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="130" r="3">
      <animate attributeName="cy" values="130;-10" dur="9.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="9.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="590" cy="130" r="1.5">
      <animate attributeName="cy" values="130;-10" dur="6.5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="130" r="2">
      <animate attributeName="cy" values="130;-10" dur="8.5s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="8.5s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="130" r="2.5">
      <animate attributeName="cy" values="130;-10" dur="7s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="130" r="1.5">
      <animate attributeName="cy" values="130;-10" dur="6s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
