<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- digitação: Thanks for stopping by -->
    <clipPath id="typing1">
      <rect x="320" y="70" height="40" width="0">
        <animate attributeName="width" values="0;260;260;0;0" keyTimes="0;0.2;0.42;0.5;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- digitação: Let's build something -->
    <clipPath id="typing2">
      <rect x="304" y="70" height="40" width="0">
        <animate attributeName="width" values="0;0;292;292;0" keyTimes="0;0.5;0.7;0.92;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="160" rx="12" fill="#0d1117"/>
  <rect width="900" height="160" rx="12" fill="url(#glow)"/>

  <!-- partículas -->
  <g fill="#8b949e">
    <circle cx="60" cy="170" r="2">
      <animate attributeName="cy" values="170;-10" dur="8s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="170" r="3">
      <animate attributeName="cy" values="170;-10" dur="10s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="170" r="1.5">
      <animate attributeName="cy" values="170;-10" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="170" r="2.5">
      <animate attributeName="cy" values="170;-10" dur="9s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="170" r="2">
      <animate attributeName="cy" values="170;-10" dur="7s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="170" r="3">
      <animate attributeName="cy" values="170;-10" dur="8.5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8.5s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="170" r="1.5">
      <animate attributeName="cy" values="170;-10" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="170" r="2">
      <animate attributeName="cy" values="170;-10" dur="9.5s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9.5s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nome -->
  <text x="450" y="55" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" font-weight="bold" fill="#ffffff">
    Izaque Nicolas
  </text>

  <!-- frase 1 -->
  <g clip-path="url(#typing1)">
    <text x="450" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#8b949e">&gt; Thanks for stopping by</text>
  </g>

  <!-- frase 2 -->
  <g clip-path="url(#typing2)">
    <text x="450" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#8b949e">&gt; Let's build something</text>
  </g>

  <!-- cursor -->
  <rect y="80" width="2" height="24" fill="#8b949e">
    <animate attributeName="x"
             values="320;580;580;320;304;596;596;304"
             keyTimes="0;0.2;0.42;0.5;0.5;0.7;0.92;1"
             dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
