<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- digitação: Full Stack Developer -->
    <clipPath id="typing1">
      <rect x="305" y="120" height="40" width="0">
        <animate attributeName="width" values="0;290;290;0;0" keyTimes="0;0.2;0.42;0.5;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- digitação: Mobile Developer -->
    <clipPath id="typing2">
      <rect x="331" y="120" height="40" width="0">
        <animate attributeName="width" values="0;0;238;238;0" keyTimes="0;0.5;0.7;0.92;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="220" rx="12" fill="#0d1117"/>
  <rect width="900" height="220" rx="12" fill="url(#glow)"/>

  <!-- partículas -->
  <g stroke="#8b949e" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="60" y1="0" x2="56" y2="12">
      <animateTransform attributeName="transform" type="translate" values="0,-20;-20,240" dur="1.6s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="170" y1="0" x2="166" y2="10">
      <animateTransform attributeName="transform" type="translate" values="0,-20;-20,240" dur="1.3s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="290" y1="0" x2="286" y2="14">
      <animateTransform attributeName="transform" type="translate" values="0,-20;-20,240" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="410" y1="0" x2="406" y2="10">
      <animateTransform attributeName="transform" type="translate" values="0,-20;-20,240" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="0" x2="526" y2="12">
      <animateTransform attributeName="transform" type="translate" values="0,-20;-20,240" dur="1.7s" begin="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="650" y1="0" x2="646" y2="10">
      <animateTransform attributeName="transform" type="translate" values="0,-20;-20,240" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="770" y1="0" x2="766" y2="14">
      <animateTransform attributeName="transform" type="translate" values="0,-20;-20,240" dur="1.9s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="860" y1="0" x2="856" y2="10">
      <animateTransform attributeName="transform" type="translate" values="0,-20;-20,240" dur="1.45s" begin="1.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- nome -->
  <text x="450" y="100" text-anchor="middle" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="#ffffff" opacity="0">
    Izaque Nicolas
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- subtítulo 1 -->
  <g clip-path="url(#typing1)">
    <text x="450" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#8b949e">&gt; Full Stack Developer</text>
  </g>

  <!-- subtítulo 2 -->
  <g clip-path="url(#typing2)">
    <text x="450" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#8b949e">&gt; Mobile Developer</text>
  </g>

  <!-- cursor -->
  <rect y="128" width="2" height="26" fill="#8b949e">
    <animate attributeName="x"
             values="305;595;595;305;331;569;569;331"
             keyTimes="0;0.2;0.42;0.5;0.5;0.7;0.92;1"
             dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
