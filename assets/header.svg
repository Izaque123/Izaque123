<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#fc6203" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typing">
      <rect x="300" y="120" height="40" width="0">
        <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.45;0.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="220" rx="12" fill="#0d1117"/>
  <rect width="900" height="220" rx="12" fill="url(#glow)"/>

  <!-- partículas -->
  <g fill="#fc6203">
    <circle cx="90" cy="230" r="2">
      <animate attributeName="cy" values="230;-10" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="230" r="3">
      <animate attributeName="cy" values="230;-10" dur="9s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="230" r="1.5">
      <animate attributeName="cy" values="230;-10" dur="6s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="230" r="2.5">
      <animate attributeName="cy" values="230;-10" dur="8s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="230" r="2">
      <animate attributeName="cy" values="230;-10" dur="10s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="230" r="3">
      <animate attributeName="cy" values="230;-10" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="230" r="1.5">
      <animate attributeName="cy" values="230;-10" dur="6.5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nome -->
  <text x="450" y="100" text-anchor="middle" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="#ffffff" opacity="0">
    Izaque Nicolas
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- subtítulo digitando -->
  <g clip-path="url(#typing)">
    <text x="450" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#fc6203">&gt; Full Stack Developer</text>
  </g>
  <rect y="128" width="2" height="26" fill="#fc6203">
    <animate attributeName="x" values="300;600;600;300" keyTimes="0;0.45;0.9;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
